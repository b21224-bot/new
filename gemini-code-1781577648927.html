<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini 수학 AI 스마트 학습 도우미</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(180deg, #F5F5F7 0%, #E8E8ED 100%);
        }
        /* 소프트 뉴모피즘 그림자 효과 */
        .soft-shadow {
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.04);
        }
        .inner-soft-shadow {
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.02);
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-12 text-[#1D1D1F]">
    <div class="max-w-5xl mx-auto bg-white/80 backdrop-blur-md p-8 md:p-10 rounded-3xl soft-shadow border border-white/40">
        
        <header class="mb-10 text-center">
            <h1 class="text-3xl md:text-4xl font-semibold tracking-tight text-[#1D1D1F]">수학 AI 스마트 학습기</h1>
        </header>
        
        <div class="flex bg-[#F5F5F7] p-1.5 rounded-2xl max-w-xl mx-auto mb-10 inner-soft-shadow">
            <button id="tabVerify" class="w-1/2 py-3 text-center font-medium text-sm rounded-xl bg-white text-[#1D1D1F] shadow-sm transition-all duration-300">
                🔍 내 풀이 오류 첨삭
            </button>
            <button id="tabGenerate" class="w-1/2 py-3 text-center font-medium text-sm rounded-xl text-[#86868B] hover:text-[#1D1D1F] transition-all duration-300">
                🎲 쌍둥이 변형 문제 생성
            </button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 items-start">
            
            <div class="space-y-6">
                <div class="bg-[#F5F5F7] p-6 rounded-2xl border border-gray-200/50 space-y-4">
                    <h2 id="leftTitle" class="text-base font-semibold text-[#1D1D1F]">✏️ 문제 및 내 풀이 등록</h2>
                    
                    <div id="dropZone" class="border border-dashed border-gray-300 p-8 text-center cursor-pointer hover:bg-white transition-all rounded-xl bg-white/50 group">
                        <div class="w-10 h-10 bg-gray-200/60 rounded-full flex items-center justify-center mx-auto mb-3 group-hover:bg-blue-50 transition-all">
                            <svg class="w-5 h-5 text-gray-500 group-hover:text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 002-2H4a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                        </div>
                        <p class="text-[#86868B] text-xs leading-relaxed">문제를 드래그하거나 클릭하여 업로드,<br>또는 <span class="font-semibold text-gray-700">Ctrl + V</span>로 붙여넣으세요.</p>
                        <input type="file" id="fileInput" class="hidden" accept="image/*">
                    </div>

                    <div id="previewContainer" class="hidden text-center bg-white p-3 rounded-xl border border-gray-100">
                        <img id="imagePreview" class="max-h-48 mx-auto rounded-lg object-contain" src="" alt="미리보기">
                    </div>

                    <div id="userSolutionWrapper" class="space-y-1.5">
                        <label class="block text-xs font-semibold text-[#86868B]">내가 작성한 풀이 과정</label>
                        <textarea id="userSolution" rows="4" class="w-full p-3 bg-white border border-gray-200 rounded-xl focus:outline-none focus:ring-1 focus:ring-gray-400 text-xs text-[#1D1D1F] placeholder-gray-400 resize-none transition-all" placeholder="생각한 풀이 식이나 답안을 적어주시면 오답을 정밀하게 교정해 드립니다."></textarea>
                    </div>
                </div>

                <button id="actionBtn" class="w-full bg-[#1D1D1F] hover:bg-[#333336] text-white font-medium py-3.5 px-4 rounded-xl transition-all duration-300 shadow-sm text-sm tracking-wide">
                    오류 검증 및 첨삭 시작
                </button>
            </div>

            <div class="bg-[#F5F5F7] p-6 rounded-2xl border border-gray-200/50 flex flex-col min-h-[420px]">
                <h2 id="rightTitle" class="text-base font-semibold text-[#1D1D1F] mb-4">🤖 AI 선생님의 첨삭 노트</h2>
                
                <div id="status" class="text-center my-auto hidden py-10 space-y-3">
                    <div class="inline-block animate-pulse w-3 h-3 bg-gray-400 rounded-full"></div>
                    <div class="inline-block animate-pulse w-3 h-3 bg-gray-500 rounded-full" style="animation-delay: 0.2s"></div>
                    <div class="inline-block animate-pulse w-3 h-3 bg-gray-600 rounded-full" style="animation-delay: 0.4s"></div>
                    <p id="statusText" class="text-xs text-[#86868B] font-medium block">데이터 분석 중...</p>
                </div>

                <div id="result" class="bg-white p-5 rounded-xl border border-gray-200 flex-1 hidden overflow-y-auto max-h-[500px] soft-shadow">
                    <div id="solutionText" class="text-sm text-[#1D1D1F] leading-relaxed space-y-4 prose prose-sm max-w-none"></div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const CUSTOM_API_KEY = "AQ.Ab8RN6IQWJiWU9lwZd0PDKmO3k6zpmWZO_wyotMrIHtl8jXfcQ"; 
        let currentMode = 'VERIFY';

        const tabVerify = document.getElementById('tabVerify');
        const tabGenerate = document.getElementById('tabGenerate');
        const leftTitle = document.getElementById('leftTitle');
        const rightTitle = document.getElementById('rightTitle');
        const userSolutionWrapper = document.getElementById('userSolutionWrapper');
        const userSolution = document.getElementById('userSolution');
        const actionBtn = document.getElementById('actionBtn');
        
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const status = document.getElementById('status');
        const statusText = document.getElementById('statusText');
        const solutionText = document.getElementById('solutionText');
        const resultDiv = document.getElementById('result');
        const previewContainer = document.getElementById('previewContainer');
        const imagePreview = document.getElementById('imagePreview');

        let currentImageData = null;
        let currentMimeType = null;

        tabVerify.addEventListener('click', () => {
            currentMode = 'VERIFY';
            tabVerify.className = "w-1/2 py-3 text-center font-medium text-sm rounded-xl bg-white text-[#1D1D1F] shadow-sm transition-all duration-300";
            tabGenerate.className = "w-1/2 py-3 text-center font-medium text-sm rounded-xl text-[#86868B] hover:text-[#1D1D1F] transition-all duration-300";
            leftTitle.innerText = "✏️ 문제 및 내 풀이 등록";
            rightTitle.innerText = "🤖 AI 선생님의 첨삭 노트";
            userSolutionWrapper.classList.remove('hidden');
            actionBtn.innerText = "오류 검증 및 첨삭 시작";
        });

        tabGenerate.addEventListener('click', () => {
            currentMode = 'GENERATE';
            tabGenerate.className = "w-1/2 py-3 text-center font-medium text-sm rounded-xl bg-white text-[#1D1D1F] shadow-sm transition-all duration-300";
            tabVerify.className = "w-1/2 py-3 text-center font-medium text-sm rounded-xl text-[#86868B] hover:text-[#1D1D1F] transition-all duration-300";
            leftTitle.innerText = "📸 원본 문제 등록";
            rightTitle.innerText = "📝 새롭게 생성된 변형 문제";
            userSolutionWrapper.classList.add('hidden');
            actionBtn.innerText = "쌍둥이 변형 문제 2개 만들기";
        });

        dropZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => { if (e.target.files.length > 0) processFile(e.target.files[0]); });

        ['dragenter', 'dragover'].forEach(n => dropZone.addEventListener(n, (e) => { e.preventDefault(); dropZone.classList.add('bg-gray-200/40'); }, false));
        ['dragleave', 'drop'].forEach(n => dropZone.addEventListener(n, (e) => { e.preventDefault(); dropZone.classList.remove('bg-gray-200/40'); }, false));
        dropZone.addEventListener('drop', (e) => { const f = e.dataTransfer.files[0]; if (f && f.type.startsWith('image/')) processFile(f); });
        window.addEventListener('paste', (e) => { const item = e.clipboardData.items[0]; if (item?.type.startsWith('image/')) processFile(item.getAsFile()); });

        function processFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                currentImageData = e.target.result.split(',')[1];
                currentMimeType = file.type;
                imagePreview.src = e.target.result;
                previewContainer.classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }

        actionBtn.addEventListener('click', () => {
            if (!currentImageData) { return alert("문항 스크린샷 이미지를 업로드해 주세요."); }
            executeMathAI(currentImageData, currentMimeType);
        });

        async function executeMathAI(base64Image, mimeType) {
            try {
                status.classList.remove('hidden');
                resultDiv.classList.add('hidden');
                
                const url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent";
                let promptText = "";

                if (currentMode === 'VERIFY') {
                    statusText.innerText = "AI가 등록된 수식과 원본 풀이를 세밀하게 대조하는 중입니다...";
                    const userProvidedText = userSolution.value.trim();
                    promptText = "너는 아주 정확하고 친절한 수학 선생님이자 교정 전문가야. 제공된 이미지 속 수학 문제를 명확하게 파악해줘.\n\n";
                    if (userProvidedText) {
                        promptText += `[사용자가 제출한 풀이 과정]\n"${userProvidedText}"\n\n` +
                                      "위의 사용자가 적은 풀이 과정과 이미지의 문제를 대조하여 문제 확인, 오류 피드백, 올바른 풀이를 제시해줘.\n";
                    } else {
                        promptText += "이미지 속 문제를 분석하여 완벽한 단계별 풀이 과정과 정답을 친절하게 설명해줘.\n";
                    }
                } else {
                    statusText.innerText = "핵심 메커니즘을 연계한 고품질 변형 문항을 생성하고 있습니다...";
                    promptText = "너는 최고의 수학 출제 위원이야. 제공된 이미지 속 문제를 분석하여 핵심 개념이 동일한 새로운 '변형 문제 2개'를 출제해줘.\n" +
                                   "변형 문제 1은 숫자 변형, 변형 문제 2는 조건/상황 변형 문항으로 만들고, 각각 정답과 해설을 포함해줘.\n\n" +
                                   "텍스트와 수식 중심으로 깔끔하게 문제를 출제해 주면 돼.\n";
                }

                promptText += "\n모든 수학식은 인라인 $ ... $, 줄바꿈 $$ ... $$ 형식의 LaTeX 문법을 사용하여 깔끔한 마크다운으로 작성해줘.";

                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-goog-api-key': CUSTOM_API_KEY },
                    body: JSON.stringify({ contents: [{ parts: [{ text: promptText }, { inline_data: { mime_type: mimeType, data: base64Image } }] }] })
                });

                if (!response.ok) { throw new Error("서버 통신에 실패했습니다."); }

                const data = await response.json();
                let text = data.candidates[0].content.parts[0].text;
                
                solutionText.innerHTML = marked.parse(text);
                status.classList.add('hidden');
                resultDiv.classList.remove('hidden');
                
                MathJax.typesetPromise([solutionText]);

            } catch (err) {
                console.error(err);
                statusText.innerText = `오류 발생: ${err.message}`;
            }
        }
    </script>
</body>
</html>
